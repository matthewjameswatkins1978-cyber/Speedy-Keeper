# Bat: thousands of task-irrelevant memories must produce the explicit
# no-memory outcome and inject nothing into the prompt.

version: terrorbat/v1

id: sk-preview-irrelevant-flood

claim:
  text: >
    A large store of memories that share no task terms with the prompt
    yields the explicit no-memory outcome with zero hits — irrelevant
    memory is never force-injected.

requires:
  - process.spawn

forbids:
  - network

attack:
  run:
    - adapter: command
      action: run
      program: node
      args:
        - bats/verifiers/sk-preview-irrelevant-flood.mjs
      env:
        SPEEDY_KEEPER_MODULES: D:\Projects\speedy-keeper\node_modules

oracle:
  type: exit_code
  step: run:0
  not_equals: 0

evidence:
  capture:
    - stdout
    - stderr

timeout:
  run: 120s
  total: 180s

meta:
  origin: speedy-keeper-b4
  tags: [speedy-keeper, preview, relevance, injection]
  description: >
    Irrelevant-memory flood (B4 Phase 7 item 5): 2000 unrelated notes,
    prompt about a billing webhook signature.
