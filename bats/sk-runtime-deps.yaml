# Bat: missing, locked and corrupted databases degrade to fast structured
# envelopes — never hangs, never raw throws, never damage to good data.

version: terrorbat/v1

id: sk-runtime-deps

claim:
  text: >
    Missing, locked and corrupted databases produce fast structured
    memory-unavailable/memory-busy failures without harming good data.

requires:
  - process.spawn

forbids:
  - network

attack:
  run:
    - adapter: command
      action: run
      program: node
      args:
        - bats/verifiers/sk-runtime-deps.mjs
      env:
        SPEEDY_KEEPER_MODULES: D:\Projects\speedy-keeper\node_modules

oracle:
  type: exit_code
  step: run:0
  not_equals: 0

evidence:
  capture:
    - stdout
    - stderr

timeout:
  run: 120s
  total: 180s

meta:
  origin: speedy-keeper-b2.1
  tags: [speedy-keeper, runtime, failure-isolation]
  description: >
    File-as-directory, held write lock (bounded fast busy envelope), and
    garbage bytes vs structured envelopes; control record must survive.
