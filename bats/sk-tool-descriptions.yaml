# Bat: model-facing contracts state accurate provisional semantics and do
# not advertise full-record retrieval the Pi tools cannot provide.

version: terrorbat/v1

id: sk-tool-descriptions

claim:
  text: >
    Tool descriptions state accurate provisional semantics and promise no
    unavailable full-record retrieval.

requires:
  - process.spawn

forbids:
  - network

attack:
  run:
    - adapter: command
      action: run
      program: node
      args:
        - bats/verifiers/sk-tool-descriptions.mjs
      env:
        SPEEDY_KEEPER_MODULES: D:\Projects\speedy-keeper\node_modules

oracle:
  type: exit_code
  step: run:0
  not_equals: 0

evidence:
  capture:
    - stdout
    - stderr

timeout:
  run: 120s
  total: 180s

meta:
  origin: speedy-keeper-b2.2
  tags: [speedy-keeper, contracts, honesty]
  description: >
    Pins the corrected wording: always-provisional saves, no evidenced
    shortcut, no full-content promises in descriptions or confirmations.
