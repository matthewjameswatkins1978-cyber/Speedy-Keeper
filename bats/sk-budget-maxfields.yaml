# Bat: maximum-length titles, bodies and source arrays still produce
# model-visible output within budget, with every fence opened also closed
# (never truncated mid-block). Budget failures must differ from empty results.

version: terrorbat/v1

id: sk-budget-maxfields

claim:
  text: >
    Maximum-size records keep memory_search output within its character
    budget with intact fences, and budget failures stay distinguishable
    from empty results.

requires:
  - process.spawn

forbids:
  - network

attack:
  run:
    - adapter: command
      action: run
      program: node
      args:
        - bats/verifiers/sk-budget-maxfields.mjs
      env:
        SPEEDY_KEEPER_MODULES: D:\Projects\speedy-keeper\node_modules

oracle:
  type: exit_code
  step: run:0
  not_equals: 0

evidence:
  capture:
    - stdout
    - stderr

timeout:
  run: 120s
  total: 180s

meta:
  origin: speedy-keeper-b2.1
  tags: [speedy-keeper, budget, context]
  description: >
    One maximal record (300-char title, 8000-char body, 50x500-char
    sources) plus small ones vs the 4000-char tool budget with a wide
    store cap, forcing the formatter backstop to cut; plus a tiny-budget
    envelope check.
